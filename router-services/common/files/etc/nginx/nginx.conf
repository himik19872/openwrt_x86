user root;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/conf.d/*.conf;
    access_log off;
    server_tokens off;
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Неизвестные хосты — редирект на основной домен
    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/ha.crt;
        ssl_certificate_key /etc/nginx/ssl/ha.key;
        return 301 https://himik1987.duckdns.org:8443$request_uri;
    }

    # Home Assistant через HTTPS
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name himik1987.duckdns.org;

        ssl_certificate     /etc/nginx/ssl/ha.crt;
        ssl_certificate_key /etc/nginx/ssl/ha.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://192.168.1.30:8123;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
